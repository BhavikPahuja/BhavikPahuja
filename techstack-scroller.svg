<svg width="100%" height="200" viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: sans-serif;
      font-size: 24px;
      font-weight: bold;
      fill: #333;
    }
  </style>
  <g>
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="translate"
                      from="0 0"
                      to="-800 0"
                      dur="20s"
                      repeatCount="indefinite"/>
    <text x="0" y="50">🐍 Python</text>
    <text x="140" y="50">💻 C</text>
    <text x="220" y="50">🌐 HTML</text>
    <text x="330" y="50">🎨 CSS</text>
    <text x="420" y="50">🟨 JavaScript</text>
    <text x="590" y="50">🔧 Git</text>
    <text x="680" y="50">☕ Java</text>
    <!-- Repeating for seamless scroll -->
    <text x="800" y="50">🐍 Python</text>
    <text x="940" y="50">💻 C</text>
    <text x="1020" y="50">🌐 HTML</text>
    <text x="1130" y="50">🎨 CSS</text>
  </g>
</svg>
